[build]
  command = "cd wfs-erp && npm run build"
  publish = "wfs-erp/dist"
  functions = "wfs-erp/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."scheduled-alerts"]
  schedule = "0 6 * * *"

[functions."scheduled-report"]
  schedule = "0 5 1 * *"
