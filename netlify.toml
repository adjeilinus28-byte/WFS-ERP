[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — React Router handles client routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled alert sweeps. Declaring cron here (NOT exports.config) is the
# reliable pattern — CommonJS exports.config does not register dependably.
[functions."scheduled-alerts"]
  schedule = "0 6 * * *"   # daily 06:00 UTC — document expiry, service due, low stock

[functions."scheduled-report"]
  schedule = "0 5 1 * *"   # 05:00 UTC on the 1st — monthly AI operations report

[functions."safety-reminders"]
  schedule = "0 7 * * *"   # daily 07:00 UTC — CCV action reminders + month-end KPI nudges
